<div class="sms-optin-form-wrapper">
  <form class="sms-optin-form" action="https://formspree.io/garlandk@managedkube.com" method="POST">
    <input type="hidden" name="_subject" value="SMS Opt-In Form Submission" />
    <input type="hidden" name="_next" value="/contact-thank-you" />
    <input type="text" name="_gotcha" style="display:none" />

    <div class="sms-optin-field">
      <label class="sms-optin-label" for="sms_full_name">Full Name</label>
      <input class="sms-optin-input" type="text" id="sms_full_name" name="full_name" placeholder="Type your full name">
    </div>

    <div class="sms-optin-field">
      <label class="sms-optin-label" for="sms_email">Email*</label>
      <input class="sms-optin-input" type="email" id="sms_email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="sms-optin-field">
      <label class="sms-optin-label" for="sms_phone">Phone Number (optional)</label>
      <input class="sms-optin-input" type="tel" id="sms_phone" name="phone_number" placeholder="Enter your phone number here">
    </div>

    <div class="sms-optin-checkbox-row">
      <!-- Checkbox is required. SMS consent is required to use our services. -->
      <input class="sms-optin-checkbox" type="checkbox" id="sms_consent" name="sms_consent" value="yes" required>
      <label class="sms-optin-checkbox-label" for="sms_consent">
        I consent to receive recurring automated text messages (SMS) from ManagedKube at the phone number provided, including messages from our AI assistant with recommendations, flight information, service updates, two-factor authentication codes, and account security notifications. Messages may contain URL links, telephone numbers, emojis, and other content. Message and data rates may apply. Reply STOP to unsubscribe at any time. Reply HELP for help. Consent is not a condition of purchasing any goods or services.
      </label>
    </div>

    <p class="sms-optin-notice" style="font-size:0.85em; color:#555; margin-top:0.5rem;">
      Mobile information will never be shared with or sold to third parties or lead generators. For more details, see our <a href="{{ '/sms-terms' | relative_url }}">SMS Terms of Service</a> and <a href="{{ '/privacy-policy' | relative_url }}">Privacy Policy</a>.
    </p>

    <button class="sms-optin-submit" type="submit">Submit</button>
  </form>
</div>
